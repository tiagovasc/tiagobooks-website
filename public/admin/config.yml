# Public content editor. Everything saved to GitHub is public, including drafts.
# Configure repository and branch through the host environment; see DEPLOYMENT.md.
backend:
  name: github
  repo: integration-repository-not-configured/site
  branch: main
  # Personal access token sign-in is available immediately. OAuth is a separate setup.

media_folder: public/uploads
public_folder: /uploads
site_url: https://tiagovf.com
display_url: https://tiagovf.com
locale: en

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{date}}  {{title}}'
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: 'HH:mm', format: "YYYY-MM-DD'T'HH:mm:ss'Z'" }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Featured image, name: image, widget: image, required: false }
      - { label: Spotify episode URL, name: spotify, widget: string, required: false, hint: 'Optional. Otherwise the Podcast page links to the show.' }
      - { label: Apple Podcasts episode URL, name: apple, widget: string, required: false, hint: 'Optional. Otherwise the Podcast page links to the show.' }
      - { label: YouTube episode URL, name: youtube, widget: string, required: false, hint: 'Optional override for the video link detected in the post.' }
      - { label: Small thumbnail, name: thumbnail, widget: image, required: false, hint: 'Optional smaller copy for blog cards. Podcast episodes use their own episode thumbnail.' }
      - label: Thumbnail crop
        name: thumbnailCrop
        widget: object
        required: false
        collapsed: true
        hint: 'Adjust the thumbnail only. The original and full article image stay unchanged. Defaults: centered, no extra zoom.'
        fields:
          - { label: Horizontal focus, name: x, widget: number, value_type: float, min: 0, max: 100, default: 50, hint: '0 = left, 50 = center, 100 = right' }
          - { label: Vertical focus, name: y, widget: number, value_type: float, min: 0, max: 100, default: 50, hint: '0 = top, 50 = center, 100 = bottom' }
          - { label: Zoom, name: zoom, widget: number, value_type: float, min: 1, max: 3, step: 0.01, default: 1, hint: '1 = fill the frame; increase slightly to hide a border in the image.' }
      - label: Artwork credit
        name: artwork
        widget: object
        required: false
        collapsed: true
        hint: Public artwork information only. Update the credit and dimensions when replacing the image.
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Artist, name: artist, widget: string }
          - { label: Year, name: year, widget: string, required: false }
          - { label: Source link, name: source, widget: string, required: false }
          - { label: Image description, name: alt, widget: string }
          - { label: Image width, name: width, widget: number, value_type: int, min: 1 }
          - { label: Image height, name: height, widget: number, value_type: int, min: 1 }
          - { label: Small preview image, name: thumbnail, widget: image, required: false }
      - { name: draft, widget: hidden, default: false }
      - { name: unlisted, widget: hidden, default: false }
      - { name: protected, widget: hidden, default: false }
      - { label: Old URL aliases, name: aliases, widget: list, required: false, default: [], hint: 'Old paths that redirect here, e.g. /2024/01/01/old-title' }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { name: draft, widget: hidden, default: false }
      - { name: unlisted, widget: hidden, default: false }
      - { name: protected, widget: hidden, default: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: settings
    label: Settings
    files:
      - label: Site settings and navigation
        name: site
        file: src/data/site.json
        fields:
          - { label: Blog title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Navigation
            name: nav
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - { label: Footer HTML, name: footerHtml, widget: text, required: false }
